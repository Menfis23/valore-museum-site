<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valore Library — Scroll Gallery (prototype)</title>
<meta name="description" content="Prototype: a lightweight scroll-snap gallery experience for Valore Library, no 3D engine.">

<!-- Brand fonts for THIS prototype only — Fraunces (headings) + Public Sans
     (body), per the explicit ask. The rest of the site uses Newsreader/
     Archivo; this page intentionally doesn't touch that. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---- Brand tokens, pulled straight from css/style.css so this prototype
     matches the real site rather than inventing its own palette. Exactly
     two accents (saffron/amber + clay/terracotta), per the ask. ---- */
  :root{
    --paper:#F1E6CE;
    --ink:#1D130F;
    --ink-70:rgba(29,19,15,.72);
    --saffron:#B8791A;
    --clay:#A8362B;
    --line:#E4D5B7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Public Sans', sans-serif;
    color:var(--ink);
    background:var(--ink);
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
  }

  /* =========================================================
     1) THE SCROLL-SNAP MECHANISM
     `scroll-snap-type: y mandatory` on the scrolling container is the
     entire trick — the browser handles the snapping natively, no JS
     needed for the snap itself. Each direct child that wants to be a
     "stop" just needs `scroll-snap-align`. This is why the effect still
     feels smooth/native on trackpads and touch, unlike a JS-animated
     scroll-jack.
     ========================================================= */
  .scroll-root{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }

  /* ---- Intro / index section: title + tilting preview cards ---- */
  .intro-section{
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(14px,3vh,28px);
    background:radial-gradient(ellipse at 50% 30%, #2a1d16 0%, #150f0a 70%);
    color:var(--paper);
    padding:20px;
    text-align:center;
    overflow:hidden; /* a prototype-stage safety net: on very short
      viewports this clips rather than breaking the one-screen-per-section
      rhythm scroll-snap otherwise assumes */
  }
  .intro-title{
    font-size:clamp(26px,5vw,48px);
    font-style:italic;
    color:var(--paper);
  }
  .intro-sub{
    max-width:520px;
    color:rgba(241,230,206,.75);
    font-size:14px;
    line-height:1.5;
  }
  .intro-hint{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--saffron);
    animation:bob 2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }

  /* ---- Preview card grid + the vanilla-tilt.js hook ----
     VanillaTilt.init() (called in the script below) attaches to every
     element with a `data-tilt` attribute automatically — the tilt math
     itself (reading cursor position, computing rotateX/rotateY) is all
     handled by that ~4KB library, nothing custom needed here beyond the
     attribute and some CSS for perspective. */
  .preview-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    max-width:860px;
  }
  .preview-card{
    width:94px;
    height:124px;
    border-radius:6px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    border:1px solid rgba(241,230,206,.18);
    /* transform-style + will-change: vanilla-tilt rotates this element in
       3D space; without these two, some browsers flatten the transform or
       repaint the whole tile sluggishly on every mouse move. */
    transform-style:preserve-3d;
    will-change:transform;
  }
  .preview-card img{
    width:100%; height:100%; object-fit:cover;
    display:block;
  }
  .preview-card .label{
    position:absolute; left:0; right:0; bottom:0;
    padding:6px 8px;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    background:linear-gradient(to top, rgba(0,0,0,.75), transparent);
    color:var(--paper);
  }

  /* =========================================================
     2) EACH GALLERY SECTION — full-bleed photo, object-fit: cover
     ========================================================= */
  .gallery-section{
    height:100vh;
    scroll-snap-align:start;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
  }
  .gallery-section .bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    /* object-fit:cover is the one line doing the actual work the brief
       asks for — the image always fills the box, cropping evenly on
       whichever axis is too long, instead of squishing (fill) or
       letterboxing (contain). Combined with a fixed 100vh container this
       looks right at any screen size/aspect ratio. */
    object-fit:cover;
    /* Starts intentionally dim + slightly scaled up; both settle to
       normal once IntersectionObserver marks the section .in-view (see
       script) — a small "arrival" cue as you scroll onto a new section,
       and it also means an unloaded (no data-src swapped in yet) image
       never flashes at full brightness before it has real pixels. */
    filter:brightness(.55);
    transform:scale(1.06);
    transition:filter 1.1s ease, transform 1.4s ease;
  }
  .gallery-section.in-view .bg{
    filter:brightness(1);
    transform:scale(1);
  }
  .gallery-section::before{
    /* Legibility scrim for the text sitting over the photo — a plain
       bottom-to-transparent gradient, not tied to the animation above. */
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(10,7,5,.85) 0%, rgba(10,7,5,.25) 45%, transparent 70%);
  }

  .section-content{
    position:relative;
    z-index:2;
    padding:0 6vw 8vw;
    max-width:720px;
    color:var(--paper);
    /* Text + SVG both animate in together, driven by the same .in-view
       toggle — translateY + opacity is the classic "rise into place"
       reveal, cheap on the GPU (only transform/opacity, no layout cost). */
    opacity:0;
    transform:translateY(28px);
    transition:opacity .8s ease, transform .8s ease;
    transition-delay:.15s;
  }
  .gallery-section.in-view .section-content{
    opacity:1;
    transform:translateY(0);
  }

  .section-eyebrow{
    font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--saffron);
    margin-bottom:10px;
  }
  .section-title{
    font-size:clamp(28px,5vw,52px);
    margin-bottom:14px;
  }
  .section-blurb{
    font-size:16px;
    line-height:1.65;
    color:rgba(241,230,206,.85);
    max-width:56ch;
  }

  /* =========================================================
     3) THE SVG LINE-DRAWING FLOURISH
     A single decorative flowing line (not a literal floor plan — a
     abstract stroke that reads as "hand-drawn ink flourish", matching
     the brand's editorial/warm tone). The draw-on animation is the
     classic stroke-dasharray/dashoffset trick: set both to the path's
     own total length so the stroke starts fully "hidden" (dashed off
     past its own end), then animate dashoffset to 0.
     ========================================================= */
  .section-flourish{
    width:120px; height:48px;
    margin-top:22px;
    display:block;
  }
  .section-flourish path{
    fill:none;
    stroke:var(--clay);
    stroke-width:2;
    stroke-linecap:round;
    /* stroke-dasharray/dashoffset values are set from JS (see script)
       once we know the path's real getTotalLength() — hardcoding a
       guessed length here would under- or over-shoot depending on the
       exact curve. */
    transition:stroke-dashoffset 1.4s ease;
    transition-delay:.3s;
  }

  .scroll-progress{
    position:fixed; right:18px; top:50%; transform:translateY(-50%);
    z-index:10;
    display:flex; flex-direction:column; gap:8px;
  }
  .scroll-progress .dot{
    width:7px; height:7px; border-radius:50%;
    background:rgba(241,230,206,.35);
    transition:background .3s ease, transform .3s ease;
  }
  .scroll-progress .dot.active{
    background:var(--saffron);
    transform:scale(1.4);
  }

  @media (prefers-reduced-motion: reduce){
    .gallery-section .bg, .section-content, .section-flourish path, .intro-hint{
      transition:none !important; animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<main class="scroll-root" id="scrollRoot">

  <section class="intro-section">
    <h1 class="intro-title">Valore Library</h1>
    <p class="intro-sub">A prototype scroll gallery — one country per screen,
      no 3D engine, just scroll-snap and a few small enhancements. Click a
      tile to jump, or just keep scrolling.</p>
    <div class="preview-grid" id="previewGrid"><!-- filled by script --></div>
    <div class="intro-hint">↓ scroll</div>
  </section>

  <div id="sectionsRoot"><!-- one .gallery-section per country, filled by script --></div>

</main>

<script src="data/countries.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // VALORE_COUNTRIES is keyed BY slug ({ iraq: {...}, eritrea: {...} }) —
  // the slug itself isn't a field inside each value, so it has to be
  // merged back in from the key (same pattern js/museum-ui.js already
  // uses for the 3D gallery's own country roster).
  const countries = Object.entries(window.VALORE_COUNTRIES || {})
    .map(([slug, c]) => ({ slug, ...c }));
  const previewGrid = document.getElementById("previewGrid");
  const sectionsRoot = document.getElementById("sectionsRoot");
  const scrollProgress = document.getElementById("scrollProgress");

  // A single reusable "ink flourish" path — same decorative line in every
  // section, just re-measured/re-triggered per instance so each section's
  // copy draws itself independently as it comes into view.
  const FLOURISH_PATH = "M2 24 C 20 4, 40 44, 60 24 S 100 4, 118 24";

  countries.forEach((c, i) => {
    // ---- Preview card (intro grid), with the vanilla-tilt hook ----
    const card = document.createElement("div");
    card.className = "preview-card";
    card.setAttribute("data-tilt", "");
    card.setAttribute("data-tilt-max", "12");   // max tilt angle in degrees
    card.setAttribute("data-tilt-speed", "400"); // transition speed back to flat
    card.setAttribute("data-tilt-glare", "true");
    card.setAttribute("data-tilt-max-glare", "0.25");
    card.innerHTML = `
      <img src="${c.heroImage}" alt="${c.name}">
      <div class="label">${c.name}</div>
    `;
    card.addEventListener("click", () => {
      document.getElementById(`section-${c.slug}`)?.scrollIntoView({ behavior: "smooth" });
    });
    previewGrid.appendChild(card);

    // ---- Full-bleed section ----
    const section = document.createElement("section");
    section.className = "gallery-section";
    section.id = `section-${c.slug}`;
    section.innerHTML = `
      <img class="bg" data-src="${c.heroImage}" alt="${c.name}">
      <div class="section-content">
        <div class="section-eyebrow">${String(i + 1).padStart(2, "0")} — ${c.region || ""}</div>
        <h2 class="section-title">${c.name}</h2>
        <p class="section-blurb">${c.blurb || ""}</p>
        <svg class="section-flourish" viewBox="0 0 120 48" aria-hidden="true">
          <path d="${FLOURISH_PATH}"></path>
        </svg>
      </div>
    `;
    sectionsRoot.appendChild(section);

    // Progress-rail dot for this section
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.dataset.target = section.id;
    scrollProgress.appendChild(dot);
  });

  // =========================================================
  // 4) LAZY-LOADING high-res images via IntersectionObserver
  // Each section's <img class="bg"> starts with only `data-src` set (no
  // `src` at all, so the browser never fetches it). rootMargin: "100%
  // 0px" means the observer fires ~one viewport height BEFORE the section
  // actually reaches the screen — the image is already loaded and settled
  // by the time you scroll to it, instead of popping in half-loaded.
  // =========================================================
  const lazyImages = document.querySelectorAll(".gallery-section .bg[data-src]");
  const lazyObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      const img = entry.target;
      img.src = img.dataset.src;
      img.removeAttribute("data-src");
      lazyObserver.unobserve(img); // never needs to fire again for this image
    });
  }, { rootMargin: "100% 0px" });
  lazyImages.forEach((img) => lazyObserver.observe(img));

  // =========================================================
  // 5) SECTION REVEAL (text rise-in + SVG line-draw) + the scroll-progress
  // dots — one more IntersectionObserver, separate from the lazy-load one
  // above on purpose: this one needs a tighter/centered trigger point (you
  // want the reveal to happen as the section is actually front-and-center,
  // not a full screen early like the image preload does), so it gets its
  // own threshold/rootMargin tuned for that instead of sharing settings
  // that would be wrong for one job or the other.
  // =========================================================
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const section = entry.target;
      const dot = scrollProgress.querySelector(`[data-target="${section.id}"]`);
      if (entry.isIntersecting) {
        section.classList.add("in-view");
        dot?.classList.add("active");
        // Measure + arm the flourish path's draw-on animation the first
        // time this section becomes visible. getTotalLength() needs the
        // SVG to already be laid out (it is, since we're reacting to it
        // being on screen), and doing this lazily (once) instead of at
        // page-load time avoids doing SVG geometry math for 15 sections
        // no one has scrolled to yet.
        const path = section.querySelector(".section-flourish path");
        if (path && !path.dataset.armed) {
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          path.dataset.armed = "true";
          requestAnimationFrame(() => { path.style.strokeDashoffset = 0; });
        }
      } else {
        dot?.classList.remove("active");
      }
    });
  }, { threshold: 0.55 });
  document.querySelectorAll(".gallery-section").forEach((s) => revealObserver.observe(s));

  // Clicking a progress dot jumps to that section
  scrollProgress.addEventListener("click", (e) => {
    const dot = e.target.closest(".dot");
    if (!dot) return;
    document.getElementById(dot.dataset.target)?.scrollIntoView({ behavior: "smooth" });
  });

  // vanilla-tilt loads with `defer`, so by DOMContentLoaded it may or may
  // not have executed yet — either wait for it or, if it's already there
  // (defer scripts run before DOMContentLoaded, so normally it IS there),
  // init immediately.
  function initTilt() {
    if (window.VanillaTilt) VanillaTilt.init(document.querySelectorAll("[data-tilt]"));
  }
  if (window.VanillaTilt) initTilt();
  else window.addEventListener("load", initTilt);
});
</script>
</body>
</html>
