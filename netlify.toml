[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # 'unsafe-inline' on script/style is required by the site's existing inline
    # <script>/style="" blocks (a wholesale rewrite to nonces/external files is
    # out of scope here) — the real XSS fix is the escapeHtml() work on every
    # user-submitted field. This CSP still blocks loading script/frame/object
    # content from any host other than the ones the site actually uses.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# publish = "." serves the whole repo root as static files, and the CLI does
# not honor .netlifyignore for these — so backend source, DB schema, and dev
# scripts were reachable directly by URL. force = true overrides the default
# "serve the file if it exists" behavior for these specific paths.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/museum_server.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate_museum_audio.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/requirements.txt"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/pid.txt"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.log"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/__pycache__/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/Gallery room improvements.zip"
  to = "/index.html"
  status = 404
  force = true

# Internal notes, plans and tooling: never meant to be public. PROJECT_NOTES.md
# in particular describes the site's security setup.
[[redirects]]
  from = "/PROJECT_NOTES.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/n8n/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/img/GALLERY_IMPLEMENTATION_SPEC.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/img/valore_gallery_room.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

# Let browsers keep images, audio and the 3D engine for a day instead of
# re-checking every file on every visit (then refresh quietly in the
# background for up to a week). File names aren't versioned, so this is kept
# short: a changed image shows up for everyone within a day.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
