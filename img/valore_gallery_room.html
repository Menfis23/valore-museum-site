  const container = document.getElementById('app');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0908);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.physicallyCorrectLights = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  scene.fog = new THREE.FogExp2(0x121010, 0.011);

  const ROOM_W = 9, ROOM_D = 26, WALL_H = 4.2, CEIL_H = 5.6;

  const cubeRT = new THREE.WebGLCubeRenderTarget(256, { format: THREE.RGBFormat, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
  const cubeCam = new THREE.CubeCamera(0.1, 60, cubeRT);
  scene.environment = cubeRT.texture;

  // ---------- Floor ----------
  function makeWoodTexture(){
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const base = ctx.createLinearGradient(0,0,512,0);
    base.addColorStop(0, '#946141'); base.addColorStop(0.5, '#a3714c'); base.addColorStop(1, '#875637');
    ctx.fillStyle = base; ctx.fillRect(0,0,512,512);
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
    for(let x=0; x<512; x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,512); ctx.stroke(); }
    for(let y=0; y<512; y+=256){
      for(let x=0; x<512; x+=128){ ctx.strokeRect(x + (y%512===0?0:64), y, 64, 256); }
    }
    for(let i=0;i<400;i++){
      ctx.strokeStyle = 'rgba(45,25,12,' + (Math.random()*0.11) + ')';
      const y = Math.random()*512;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(512, y + (Math.random()*6-3)); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(3, ROOM_D/3);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function makeFloorRoughness(){
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(0,0,512,512);
    for(let i=0;i<900;i++){
      const v = 40 + Math.random()*90;
      ctx.fillStyle = 'rgba('+v+','+v+','+v+',0.35)';
      ctx.fillRect(Math.random()*512, Math.random()*512, 2+Math.random()*40, 1+Math.random()*3);
    }
    for(let i=0;i<20;i++){
      const g = ctx.createRadialGradient(Math.random()*512, Math.random()*512, 5, Math.random()*512, Math.random()*512, 90);
      g.addColorStop(0,'rgba(150,150,150,0.25)'); g.addColorStop(1,'rgba(150,150,150,0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, ROOM_D/3);
    return t;
  }
  const floorTex = makeWoodTexture();
  floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const floorMat = new THREE.MeshStandardMaterial({
    map: floorTex, roughnessMap: makeFloorRoughness(),
    roughness: 0.34, metalness: 0.0,
    envMap: cubeRT.texture, envMapIntensity: 1.3
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // ---------- Ceiling ----------
  const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0e0e10, roughness: 0.95 });
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilMat);
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = CEIL_H;
  scene.add(ceiling);

  const pipeMat = new THREE.MeshStandardMaterial({ color: 0x16161a, roughness: 0.5, metalness: 0.6 });
  for(let i=0;i<2;i++){
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,ROOM_D-2,8), pipeMat);
    pipe.rotation.x = Math.PI/2;
    pipe.position.set(-1.2 + i*2.4, CEIL_H - 0.4, 0);
    scene.add(pipe);
  }

  // ---------- Walls ----------
  function makeWallTexture(){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f5ead6'; ctx.fillRect(0,0,1024,512);
    for(let i=0;i<2500;i++){
      const a = Math.random()*0.03;
      ctx.fillStyle = 'rgba('+(Math.random()>0.5?255:200)+','+(Math.random()>0.5?245:195)+',220,'+a+')';
      ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, 3+Math.random()*22, 0, Math.PI*2); ctx.fill();
    }
    const grd = ctx.createLinearGradient(0,512,0,340);
    grd.addColorStop(0,'rgba(70,52,34,0.22)'); grd.addColorStop(1,'rgba(70,52,34,0)');
    ctx.fillStyle = grd; ctx.fillRect(0,0,1024,512);
    const grdTop = ctx.createLinearGradient(0,0,0,130);
    grdTop.addColorStop(0,'rgba(45,34,22,0.30)'); grdTop.addColorStop(1,'rgba(45,34,22,0)');
    ctx.fillStyle = grdTop; ctx.fillRect(0,0,1024,512);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const wallMat = new THREE.MeshStandardMaterial({ map: makeWallTexture(), roughness: 0.94 });

  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, WALL_H), wallMat);
  leftWall.position.set(-ROOM_W/2, WALL_H/2, 0);
  leftWall.rotation.y = Math.PI/2;
  leftWall.receiveShadow = true;
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, WALL_H), wallMat);
  rightWall.position.set(ROOM_W/2, WALL_H/2, 0);
  rightWall.rotation.y = -Math.PI/2;
  rightWall.receiveShadow = true;
  scene.add(rightWall);

  // Trim
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xfbf7ec, roughness: 0.55 });
  [-1,1].forEach(function(s){
    const bb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, ROOM_D), trimMat);
    bb.position.set(s*(ROOM_W/2 - 0.03), 0.08, 0);
    bb.receiveShadow = true; bb.castShadow = true;
    scene.add(bb);
    const rev = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, ROOM_D), new THREE.MeshStandardMaterial({ color: 0x0d0d0f, roughness: 1.0 }));
    rev.position.set(s*(ROOM_W/2 - 0.04), WALL_H + 0.05, 0);
    scene.add(rev);
  });

  function makeContactShadowTex(){
    const c = document.createElement('canvas'); c.width = 4; c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,0,64);
    g.addColorStop(0,'rgba(0,0,0,0.42)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,4,64);
    return new THREE.CanvasTexture(c);
  }
  const contactMat = new THREE.MeshBasicMaterial({ map: makeContactShadowTex(), transparent: true, depthWrite: false });
  [-1,1].forEach(function(s){
    const cs = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, 0.5), contactMat);
    cs.rotation.x = -Math.PI/2; cs.rotation.z = Math.PI/2;
    cs.position.set(s*(ROOM_W/2 - 0.28), 0.012, 0);
    scene.add(cs);
  });

  // Back wall + archway
  const backPanelW = (ROOM_W - 3.2)/2;
  const backL = new THREE.Mesh(new THREE.PlaneGeometry(backPanelW, WALL_H), wallMat);
  backL.position.set(-ROOM_W/2 + backPanelW/2, WALL_H/2, ROOM_D/2);
  backL.rotation.y = Math.PI;
  scene.add(backL);
  const backR = backL.clone();
  backR.position.x = ROOM_W/2 - backPanelW/2;
  scene.add(backR);
  const lintel = new THREE.Mesh(new THREE.PlaneGeometry(3.2, WALL_H - 3.0), wallMat);
  lintel.position.set(0, WALL_H - (WALL_H-3.0)/2, ROOM_D/2);
  lintel.rotation.y = Math.PI;
  scene.add(lintel);

  const beyond = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.0), new THREE.MeshStandardMaterial({ color: 0x2b241b, roughness: 1.0 }));
  beyond.position.set(0, 1.5, ROOM_D/2 + 6);
  scene.add(beyond);

  // Far wall (closes the corridor)
  const farWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, WALL_H), wallMat);
  farWall.position.set(0, WALL_H/2, -ROOM_D/2);
  farWall.receiveShadow = true;
  scene.add(farWall);

  // ---------- Track rails ----------
  const railMat = new THREE.MeshStandardMaterial({ color: 0x121215, roughness: 0.4, metalness: 0.7 });
  [-1,1].forEach(function(s){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, ROOM_D - 2), railMat);
    rail.position.set(s*(ROOM_W/2 - 1.0), CEIL_H - 0.15, 0);
    scene.add(rail);
  });

  function makeGlowTexture(){
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0, 'rgba(255,235,195,0.95)');
    g.addColorStop(1, 'rgba(255,235,195,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTexture();

  // ---------- Placard label texture ----------
  function makePlacard(title){
    const c = document.createElement('canvas'); c.width = 512; c.height = 160;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#faf6ec'; ctx.fillRect(0,0,512,160);
    ctx.fillStyle = '#2b2419';
    ctx.font = 'bold 44px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(title, 256, 66);
    ctx.font = 'italic 28px Georgia'; ctx.fillStyle = '#6b5c46';
    ctx.fillText('BHTart', 256, 112);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  // ---------- Materials shared by all artworks ----------
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x241c14, roughness: 0.45, metalness: 0.2 });
  const mattMat  = new THREE.MeshStandardMaterial({ color: 0xf8f4e9, roughness: 0.95 });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.05, metalness: 0.0,
    transparent: true, opacity: 0.06,
    envMap: cubeRT.texture, envMapIntensity: 1.4
  });

  const texLoader = new THREE.TextureLoader();
  const placed = [];

  // Distribute: alternate walls down the room
  const total = ARTWORKS_SRC.length;
  const leftItems  = ARTWORKS_SRC.filter(function(_,i){ return i % 2 === 0; });
  const rightItems = ARTWORKS_SRC.filter(function(_,i){ return i % 2 === 1; });

  function layoutWall(items, wallSide){
    const spacing = ROOM_D / (items.length + 1);
    items.forEach(function(item, i){
      const z = -ROOM_D/2 + spacing*(i+1);
      placeArtwork(item, wallSide, z);
    });
  }

  function placeArtwork(item, wallSide, z){
    // ---- Size from the TRUE aspect ratio: never stretch, never crop ----
    const MAX_H = 1.40, MAX_W = 1.75;
    let h = MAX_H, w = h * item.aspect;
    if (w > MAX_W) { w = MAX_W; h = w / item.aspect; }

    const mattPad = 0.12, framePad = 0.06;
    const fw = w + (mattPad + framePad)*2;
    const fh = h + (mattPad + framePad)*2;

    const xWall = wallSide * (ROOM_W/2 - 0.02);
    const yRot  = wallSide > 0 ? -Math.PI/2 : Math.PI/2;
    const y = 2.0;

    const frame = new THREE.Mesh(new THREE.BoxGeometry(fw, fh, 0.07), frameMat);
    frame.position.set(xWall - wallSide*0.035, y, z);
    frame.rotation.y = yRot;
    frame.castShadow = true; frame.receiveShadow = true;
    scene.add(frame);

    const matt = new THREE.Mesh(new THREE.PlaneGeometry(w + mattPad*2, h + mattPad*2), mattMat);
    matt.position.set(xWall - wallSide*0.055, y, z);
    matt.rotation.y = yRot;
    scene.add(matt);

    // The painting itself — plane geometry built at the image's own aspect
    const tex = texLoader.load(item.src);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    const artMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.72, metalness: 0.0 });
    const art = new THREE.Mesh(new THREE.PlaneGeometry(w, h), artMat);
    art.position.set(xWall - wallSide*0.06, y, z);
    art.rotation.y = yRot;
    scene.add(art);

    const glass = new THREE.Mesh(new THREE.PlaneGeometry(fw - 0.05, fh - 0.05), glassMat);
    glass.position.set(xWall - wallSide*0.024, y, z);
    glass.rotation.y = yRot;
    scene.add(glass);

    // Wall placard beneath
    const placard = new THREE.Mesh(
      new THREE.PlaneGeometry(0.46, 0.145),
      new THREE.MeshStandardMaterial({ map: makePlacard(item.title), roughness: 0.85 })
    );
    placard.position.set(xWall - wallSide*0.05, y - fh/2 - 0.24, z);
    placard.rotation.y = yRot;
    scene.add(placard);

    placed.push({ x: xWall - wallSide*0.5, y: y, z: z, wallSide: wallSide, fh: fh });
  }

  layoutWall(leftItems, -1);
  layoutWall(rightItems, 1);

  // ---------- Spotlights on each painting ----------
  const coneMat = new THREE.MeshBasicMaterial({
    color: 0xffe6c0, transparent: true, opacity: 0.028,
    depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
  });

  placed.forEach(function(a){
    const fixtureX = a.wallSide > 0 ? a.x - 0.9 : a.x + 0.9;
    const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,0.14,10), railMat);
    fixture.position.set(fixtureX, CEIL_H - 0.15, a.z);
    scene.add(fixture);

    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite:false, blending: THREE.AdditiveBlending }));
    glow.scale.set(0.7,0.7,0.7);
    glow.position.copy(fixture.position);
    scene.add(glow);

    const spot = new THREE.SpotLight(0xfff0d8, 105, 12, Math.PI/6.2, 0.85, 1.5);
    spot.position.copy(fixture.position);
    spot.target.position.set(a.x, a.y, a.z);
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024,1024);
    spot.shadow.radius = 4;
    spot.shadow.bias = -0.0008;
    spot.shadow.camera.near = 0.5;
    spot.shadow.camera.far = 13;
    scene.add(spot, spot.target);

    const from = fixture.position.clone();
    const to = new THREE.Vector3(a.x, a.y, a.z);
    const len = from.distanceTo(to);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.66, len, 20, 1, true), coneMat);
    cone.position.copy(from.clone().lerp(to, 0.5));
    cone.lookAt(to);
    cone.rotateX(Math.PI/2);
    scene.add(cone);
  });

  // ---------- Ambient + fill (brighter overall) ----------
  scene.add(new THREE.HemisphereLight(0x6b5c48, 0x2c2218, 0.75));
  scene.add(new THREE.AmbientLight(0xfff2dd, 0.28));

  // Warm downlights along the centre of the room, lifting the whole space
  for(let i=0;i<5;i++){
    const cz = -ROOM_D/2 + (i+1)*(ROOM_D/6);
    const dl = new THREE.PointLight(0xffe4bd, 26, 11, 2);
    dl.position.set(0, CEIL_H - 0.6, cz);
    scene.add(dl);
    const bulb = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending }));
    bulb.scale.set(0.9,0.9,0.9);
    bulb.position.set(0, CEIL_H - 0.55, cz);
    scene.add(bulb);
  }

  // Low wall-wash so the walls glow rather than fall to black between paintings
  for(let i=0;i<4;i++){
    const wz = -ROOM_D/2 + (i+1)*(ROOM_D/5);
    [-1,1].forEach(function(s){
      const wash = new THREE.PointLight(0xffdfb4, 9, 6.5, 2);
      wash.position.set(s*(ROOM_W/2 - 0.6), 1.0, wz);
      scene.add(wash);
    });
  }

  const fillSpot = new THREE.SpotLight(0xffead0, 30, 18, Math.PI/3, 0.9, 1.8);
  fillSpot.position.set(0, CEIL_H - 0.2, ROOM_D/2 - 1);
  fillSpot.target.position.set(0, 1.5, ROOM_D/2 + 2);
  scene.add(fillSpot, fillSpot.target);

  // ---------- Seating, rug, plants ----------
  const benchWoodMat = new THREE.MeshStandardMaterial({ color: 0x6b4a30, roughness: 0.55 });
  const cushionMat = new THREE.MeshStandardMaterial({ color: 0xb5745a, roughness: 0.85 });
  function addBench(x, z){
    const legs = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.36, 0.46), benchWoodMat);
    legs.position.set(x, 0.18, z); legs.castShadow = true;
    const cushion = new THREE.Mesh(new THREE.BoxGeometry(1.44, 0.1, 0.4), cushionMat);
    cushion.position.set(x, 0.41, z); cushion.castShadow = true;
    scene.add(legs, cushion);
  }
  addBench(0, 4); addBench(0, -4);

  const rug = new THREE.Mesh(new THREE.CircleGeometry(1.7, 32), new THREE.MeshStandardMaterial({ color: 0x8f3330, roughness: 1.0 }));
  rug.rotation.x = -Math.PI/2; rug.position.set(0, 0.006, 4); rug.receiveShadow = true;
  scene.add(rug);

  function addPlant(x, z){
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0x8a5a3a, roughness: 0.8 }));
    pot.position.set(x, 0.2, z); pot.castShadow = true;
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x40643f, roughness: 0.75 });
    const group = new THREE.Group();
    for(let i=0;i<6;i++){
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), leafMat);
      const ang = (i/6)*Math.PI*2;
      leaf.position.set(Math.cos(ang)*0.18, 0.7 + Math.random()*0.5, Math.sin(ang)*0.18);
      leaf.scale.set(0.8, 1.3, 0.8);
      group.add(leaf);
    }
    group.position.set(x, 0.2, z);
    scene.add(pot, group);
  }
  addPlant(-ROOM_W/2 + 0.9, ROOM_D/2 - 1.4);
  addPlant(ROOM_W/2 - 0.9, ROOM_D/2 - 1.4);

  // ---------- Welcome sign ----------
  function makeWelcomeSign(){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1d1611'; ctx.fillRect(0,0,1024,256);
    ctx.fillStyle = '#f5dcae';
    ctx.font = 'italic 78px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Welcome', 512, 118);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const welcomeSign = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 0.65),
    new THREE.MeshStandardMaterial({ map: makeWelcomeSign(), roughness: 0.6, emissive: 0x3a2a18, emissiveIntensity: 0.45 })
  );
  welcomeSign.position.set(0, WALL_H - 0.5, ROOM_D/2 - 0.05);
  welcomeSign.rotation.y = Math.PI;
  scene.add(welcomeSign);
  const welcomeLight = new THREE.PointLight(0xffe0b0, 8, 4.5, 2);
  welcomeLight.position.set(0, WALL_H - 0.1, ROOM_D/2 - 0.6);
  scene.add(welcomeLight);

  // ---------- Dust motes ----------
  const moteCount = 240;
  const motePos = new Float32Array(moteCount*3);
  for(let i=0;i<moteCount;i++){
    motePos[i*3]   = (Math.random()-0.5)*(ROOM_W-1);
    motePos[i*3+1] = 0.4 + Math.random()*(CEIL_H-0.8);
    motePos[i*3+2] = (Math.random()-0.5)*(ROOM_D-1);
  }
  const moteGeo = new THREE.BufferGeometry();
  moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
  const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
    color: 0xffeed2, size: 0.017, transparent: true, opacity: 0.42,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  }));
  scene.add(motes);

  // ---------- Bake reflections once ----------
  floor.visible = false;
  cubeCam.position.set(0, 1.6, 0);
  cubeCam.update(renderer, scene);
  floor.visible = true;

  // ---------- Controls ----------
  let targetYaw = 0, targetPitch = -0.03, yaw = 0, pitch = -0.03;
  let dragging = false, lastX = 0, lastY = 0, bobPhase = 0;
  const camPos = new THREE.Vector3(0, 1.65, ROOM_D/2 - 2);

  renderer.domElement.addEventListener('mousedown', function(e){ dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', function(){ dragging = false; });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    targetYaw -= (e.clientX - lastX) * 0.005;
    targetPitch -= (e.clientY - lastY) * 0.004;
    targetPitch = Math.max(-1.0, Math.min(0.6, targetPitch));
    lastX = e.clientX; lastY = e.clientY;
  });

  const keys = {};
  window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

  function updateCamera(){
    yaw += (targetYaw - yaw)*0.12;
    pitch += (targetPitch - pitch)*0.12;
    const forward = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(-forward.z, 0, forward.x);
    const speed = 0.075;
    let moving = false;
    if(keys['w']){ camPos.addScaledVector(forward, speed); moving = true; }
    if(keys['s']){ camPos.addScaledVector(forward, -speed); moving = true; }
    if(keys['a']){ camPos.addScaledVector(right, -speed); moving = true; }
    if(keys['d']){ camPos.addScaledVector(right, speed); moving = true; }
    camPos.x = Math.max(-ROOM_W/2+0.6, Math.min(ROOM_W/2-0.6, camPos.x));
    camPos.z = Math.max(-ROOM_D/2+1, Math.min(ROOM_D/2+4, camPos.z));

    if(moving) bobPhase += 0.16;
    const t = performance.now()*0.001;
    const bobY = moving ? Math.sin(bobPhase)*0.022 : Math.sin(t*1.1)*0.005;
    const bobX = moving ? Math.cos(bobPhase*0.5)*0.012 : 0;

    camera.position.set(camPos.x + bobX, camPos.y + bobY, camPos.z);
    const look = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch));
    camera.lookAt(camera.position.clone().add(look));
  }

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate(){
    requestAnimationFrame(animate);
    updateCamera();
    const p = moteGeo.attributes.position.array;
    const tt = performance.now()*0.0002;
    for(let i=0;i<moteCount;i++){
      p[i*3] += Math.sin(tt+i)*0.0009;
      p[i*3+1] += 0.0011;
      if(p[i*3+1] > CEIL_H-0.3) p[i*3+1] = 0.3;
    }
    moteGeo.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
  }
  animate();

  setTimeout(function(){
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(function(){ l.style.display = 'none'; }, 800);
  }, 700);
})();
</script>
</body>
</html>
